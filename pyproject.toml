[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "market-platform"
version = "0.1.0"
description = "Self-Hosted Stock & ETF Research Platform"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # ── API ──
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # ── Cache ──
    "redis[hiredis]>=5.0.0",

    # ── Object Storage ──
    "boto3>=1.34.0",

    # ── Task Queue ──
    "prefect>=2.14.0",

    # ── Data & Analytics ──
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",

    # ── Indicators ──
    "pandas-ta-classic>=0.3.14b1",

    # ── Backtesting ──
    "vectorbt>=0.26.0",

    # ── Portfolio ──
    "pyportfolioopt>=1.5.5",
    "quantstats>=0.0.62",

    # ── ML ──
    "scikit-learn>=1.4.0",
    "lightgbm>=4.2.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",

    # ── Auth ──
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",

    # ── HTTP client ──
    "httpx>=0.26.0",

    # ── Data feeds ──
    "yfinance>=0.2.36",

    # ── Reporting ──
    "jinja2>=3.1.3",
    "weasyprint>=61.0",
    "plotly>=5.18.0",

    # ── Observability ──
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "structlog>=24.1.0",

    # ── Utilities ──
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "orjson>=3.9.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.92.0",
    "playwright>=1.41.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
    "golden: Golden/backtest reproducibility tests",
    "e2e: End-to-end Playwright tests",
    "performance: Performance benchmarks",
]
